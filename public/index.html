<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UB Beauty Salon — Chatbot</title>
    <style>
      :root {
        --bg: #faf7f5;
        --fg: #2b2320;
        --muted: #8a7d76;
        --accent: #c98a7a;
        --card: #ffffff;
        --border: #eaddd7;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1917;
          --fg: #f2ebe7;
          --muted: #a9998f;
          --accent: #d9a596;
          --card: #262220;
          --border: #3a332f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 460px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
        margin-bottom: 20px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 6px; color: var(--muted); line-height: 1.55; }
      .flower { font-size: 40px; margin-bottom: 8px; }
      code {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 13px;
        color: var(--accent);
      }
      .links { margin-top: 20px; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="flower">🌸</div>
      <div class="badge"><span class="dot"></span> Chatbot ажиллаж байна</div>
      <h1>UB Beauty Salon</h1>
      <p>Facebook Messenger чатботын сервер идэвхтэй байна.</p>
      <div class="links">
        Health JSON: <code>/status</code> · Webhook: <code>/webhook</code>
      </div>
    </main>
  </body>
</html>
